# Gera o instalador do Windows e publica na página Releases.
# Para lançar uma versão: mude "version" no package.json da raiz, faça o commit e rode
#   git tag v1.0.1
#   git push origin v1.0.1
name: Instalador do Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run instalador
      - name: Cópia com nome fixo (para o link de download da landing)
        shell: pwsh
        run: Copy-Item (Get-ChildItem instalador\NEXO-PDV-Setup-*.exe | Select -First 1).FullName instalador\NEXO-PDV-Setup.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: NEXO PDV ${{ github.ref_name }}
          body: |
            Instalador para Windows 10 e 11. Baixe o **NEXO-PDV-Setup.exe**, rode e siga as telas.

            Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações** e depois em **Executar assim mesmo**. O aviso aparece porque o instalador ainda não tem assinatura digital.

            Tutorial: https://github.com/thiagopfreire160/nexo-pdv/blob/main/docs/TUTORIAL.md
          files: |
            instalador/NEXO-PDV-Setup.exe
            instalador/NEXO-PDV-Setup-*.exe
