services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AGI_SENHA_BANCO:-agipdv}
      POSTGRES_DB: agipdv
    ports:
      - "5432:5432"
    volumes:
      - agipdv_dados:/var/lib/postgresql/data
      - ./infra/criar-banco-teste.sql:/docker-entrypoint-initdb.d/criar-banco-teste.sql:ro

volumes:
  agipdv_dados:
